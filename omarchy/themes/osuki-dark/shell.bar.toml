# A floating pill drawn by the user-owned ryu.bar clone. These custom keys are
# ignored by the stock bar, so the theme remains usable without the clone.
background        = "#0B111A"
background-alpha  = 0.60
text              = "#FCFBFA"
active            = "#FF5A4A"
scale-with-font   = true
size-horizontal   = 34
size-vertical     = 34
pill              = true
pill-edge-margin  = 8
pill-cross-margin = 3
pill-padding      = 10
pill-border       = "#1C2532"
pill-border-alpha = 0.90
pill-border-width = 1
