# Fill-first controls. Geometry stays with the shell; the bar pill itself uses
# a true height/2 radius and does not depend on Hyprland window rounding.
normal-color        = "foreground"
normal-fill-alpha   = 0.08
normal-border-width = 0

hover-cursor-color        = "foreground"
hover-cursor-fill-alpha   = 0.14
hover-cursor-border-width = 0

focus-color        = "#3E63FF"
focus-fill-alpha   = 0.12
focus-border       = "#3E63FF"
focus-border-width = 2
focus-border-alpha = 1.0

selected-color        = "accent"
selected-fill-alpha   = 0.18
selected-border-width = 0

pressed-fill-alpha   = 0.22
selection-fill-alpha = 0.30
