schema:
  schema_id: sno_japanese
  name: Japanese
  version: "2.0.0"
  author:
    - ensigma96
    - snomiao
  description: A focused Japanese Romaji input scheme.

switches:
  - name: ascii_mode
    reset: 0
    states: [Japanese, Latin]
  - name: full_shape
    states: [Half, Full]
  - name: ascii_punct
    states: [JP, ASCII]
  - name: hiragana_katakana
    reset: 0
    states: [Hiragana, Katakana]

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - table_translator
  filters:
    - simplifier@hiragana_katakana
    - uniquifier

speller:
  alphabet: "zyxwvutsrqponmlkjihgfedcba-_"
  delimiter: " '"
  algebra:
    - derive/_/x/
    - derive/-/q/
    - derive/i_e/ye/
    - derive/tu/tsu/
    - derive/si/shi/

translator:
  dictionary: japanese
  enable_completion: false
  spelling_hints: 5
  comment_format:
    - "xlit|q|ー|"
  preedit_format:
    - "xlit|q|ー|"

hiragana_katakana:
  option_name: hiragana_katakana
  opencc_config: hiragana_katakana.json
  tips: none

punctuator:
  import_preset: default

key_binder:
  import_preset: default
  bindings:
    - { accept: "Control+Shift+1", toggle: ascii_mode, when: always }
    - { accept: "Control+Shift+2", toggle: full_shape, when: always }
    - { accept: "Control+Shift+3", toggle: ascii_punct, when: always }
    - { accept: "Control+Shift+5", toggle: hiragana_katakana, when: always }

recognizer:
  import_preset: default
